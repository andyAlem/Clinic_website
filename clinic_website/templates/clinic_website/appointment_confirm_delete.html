{% extends 'clinic_website/base.html' %}
{% block title %}Удалить запись{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Удалить запись?</h3>
    <p>Вы уверены, что хотите удалить запись от {{ object.date }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'clinic_website:appointments_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
